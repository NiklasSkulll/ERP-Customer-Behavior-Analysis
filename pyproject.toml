[project]
name = "erp-customer-behavior-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "markdown>=3.11.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly[express]>=7.1.0",
    "pyarrow>=26.0.0",
    "ruptures>=1.1.10",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "anywidget>=0.11.0",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "nbconvert>=7.17.2",
]
